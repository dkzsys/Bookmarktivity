name: Unsigned Windows test installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test browser-independent behavior
        run: npm test

      - name: Check desktop types
        run: npm run typecheck

      - name: Test Edge adapter
        run: cargo test --manifest-path packages/browser-edge/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri -w @bookmarktivity/desktop -- build --bundles nsis

      - name: Verify installer is a Windows executable
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          node scripts/check-windows-installer.mjs $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Bookmarktivity-Windows-x64-UNSIGNED-test-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
